services:
  alexa:
    image: igw-alexa:voice-review
    pull_policy: never
    container_name: igw-alexa
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8091:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

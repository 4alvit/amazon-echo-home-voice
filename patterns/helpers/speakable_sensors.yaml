# Example package fragment — rename entities for your install.
# Goal: one clear, speakable sensor per voice question.

template:
  - sensor:
      - name: "Battery percent"
        unique_id: voice_battery_percent
        unit_of_measurement: "%"
        state: "{{ states('sensor.YOUR_BATTERY_SOC') | float(0) | round(0) }}"

      - name: "Solar power"
        unique_id: voice_solar_power
        unit_of_measurement: "W"
        state: "{{ states('sensor.YOUR_SOLAR_WATTS') | float(0) | round(0) }}"

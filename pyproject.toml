[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-echo-home-voice"
version = "0.3.0"
description = "Read-only Alexa custom skill for inverter-gateway energy reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
multi-household = ["cryptography==50.0.1"]
webhook = [
  "ask-sdk-webservice-support==1.3.3",
  "gunicorn==23.0.0",
  # Upstream fix for OpenSSL versions with multiple-digit components (PyPI 1.3.0 lacks it).
  "oscrypto @ https://github.com/wbond/oscrypto/archive/d5f3437ed24257895ae1edd9e503cfb352e635a8.tar.gz",
]

[project.scripts]
energy-voice = "amazon_echo_home_voice.cli:main"
energy-voice-admin = "amazon_echo_home_voice.tenant_store:main"

[tool.setuptools.packages.find]
where = ["src"]

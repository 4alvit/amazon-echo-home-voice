[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-echo-home-voice"
version = "0.3.6"
description = "Read-only Alexa custom skill for inverter-gateway energy reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "cryptography==50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
multi-household = ["cryptography==50.0.2"]
webhook = [
  "certifi>=2026.10.19",
  "ask-sdk-webservice-support==1.3.3",
  "gunicorn==23.0.0",
  # Upstream fix for OpenSSL versions with multiple-digit components (PyPI 1.3.0 lacks it).
  "oscrypto @ https://github.com/wbond/oscrypto/archive/d5f3437ed24257895ae1edd9e503cfb352e635a8.tar.gz#sha256=f40d112bb8b5ca8cd424d64d80b3bd39a48bc1d769206f2c4d79fd9b0618ae74",
]

[project.scripts]
energy-voice = "amazon_echo_home_voice.cli:main"
energy-voice-admin = "amazon_echo_home_voice.tenant_store:main"

[tool.setuptools.packages.find]
where = ["src"]

# Static metadata from the exact oscrypto archive pinned above.
# Its setup.py declares only asn1crypto>=1.5.1; dependency resolution must not run it.
[[tool.uv.dependency-metadata]]
name = "oscrypto"
version = "1.3.0"
requires-dist = ["asn1crypto>=1.5.1"]
